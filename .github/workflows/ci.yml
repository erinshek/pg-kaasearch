name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}

      - name: Build and install
        run: |
          make
          make install

      - name: Regression tests
        run: make installcheck

      - name: Non-UTF8 database is refused with a clear error
        run: |
          psql -d postgres -c "CREATE DATABASE kaa_ascii TEMPLATE template0 ENCODING 'SQL_ASCII' LC_COLLATE 'C' LC_CTYPE 'C'"
          out=$(psql -d kaa_ascii -c 'CREATE EXTENSION kaasearch' 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'kaasearch requires a UTF8 database'

      - name: Show regression diffs
        if: failure()
        run: cat regression.diffs || true

  kaastem:
    name: kaastem (Python ${{ matrix.python }})
    # Pinned: ubuntu-latest (26.04) has no prebuilt Python older than 3.10.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Stemmer tests
        working-directory: kaastem
        run: python tests/run_tests.py

      - name: C tables are up to date with kaastem
        run: python tools/gen_tables.py --check

      - name: Generated SQL test is up to date
        run: python tools/gen_sql_tests.py --check

      - name: C core gives the same analysis as kaastem
        run: |
          cc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
             -Isrc test/core/kaacore_cli.c src/kaacore.c src/kaadata.c -o kaacore_cli
          python test/core/compare.py ./kaacore_cli

      - name: Fuzz the C core (60 s)
        if: matrix.python == '3.13'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang-18 libclang-rt-18-dev
          clang-18 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
             -Isrc test/core/fuzz_kaacore.c src/kaacore.c src/kaadata.c -o fuzz_kaacore
          ./fuzz_kaacore -max_total_time=60 -max_len=256 -timeout=5
