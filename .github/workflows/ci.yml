name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}

      - name: Build and install
        run: |
          make
          make install

      - name: Regression tests
        run: make installcheck

      - name: Non-UTF8 database is refused with a clear error
        run: |
          psql -d postgres -c "CREATE DATABASE kaa_ascii TEMPLATE template0 ENCODING 'SQL_ASCII' LC_COLLATE 'C' LC_CTYPE 'C'"
          out=$(psql -d kaa_ascii -c 'CREATE EXTENSION pg_kaasearch' 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'pg_kaasearch requires a UTF8 database'

      - name: Show regression diffs
        if: failure()
        run: cat regression.diffs || true

  kaastem:
    name: kaastem (Python ${{ matrix.python }})
    # Pinned: ubuntu-latest (26.04) has no prebuilt Python older than 3.10.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Stemmer tests
        working-directory: kaastem
        run: python tests/run_tests.py

      - name: C tables are up to date with kaastem
        run: python tools/gen_tables.py --check

      - name: Generated SQL test is up to date
        run: python tools/gen_sql_tests.py --check

      - name: C core gives the same analysis as kaastem
        run: |
          cc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
             -Isrc test/core/kaacore_cli.c src/kaacore.c src/kaadata.c -o kaacore_cli
          python test/core/compare.py ./kaacore_cli

      - name: Fuzz the C core (60 s)
        if: matrix.python == '3.13'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang-18 libclang-rt-18-dev
          clang-18 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
             -Isrc test/core/fuzz_kaacore.c src/kaacore.c src/kaadata.c -o fuzz_kaacore
          ./fuzz_kaacore -max_total_time=60 -max_len=256 -timeout=5

  packaging:
    name: Packaging (.deb and Docker, PostgreSQL 17)
    # Builds what the release workflow publishes, so a broken package shows up before a tag is pushed.
    # Nothing is published here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the .deb package and run the tests against it
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 sh -ec '
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates curl gnupg postgresql-common \
              make gcc libc6-dev binutils
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            mkdir -p /etc/postgresql-common/createcluster.d
            echo "create_main_cluster = false" > /etc/postgresql-common/createcluster.d/no-main.conf
            apt-get install -y -q --no-install-recommends postgresql-17 postgresql-server-dev-17
            sh packaging/build-deb.sh 17 0.0.0~ci dist
            dpkg -i dist/*.deb
            rm -f pg_kaasearch.so src/*.o
            pg_createcluster -e UTF8 --locale C.UTF-8 17 test --start
            chown -R postgres .
            su postgres -c "make installcheck PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config" \
              || { cat regression.diffs; exit 1; }'

      - name: Build the Docker image and test it
        run: |
          docker build -f packaging/Dockerfile --build-arg PG_MAJOR=17 -t pg_kaasearch:ci .
          docker run -d --name kaa -e POSTGRES_PASSWORD=test pg_kaasearch:ci
          want="'mektep':2,3 'ózbekstan':1"
          for i in $(seq 1 30); do
            sleep 2
            out=$(docker exec kaa psql -U postgres -tAc \
              "SELECT to_tsvector('kaasearch', 'O''zbekstan mektebimizde Мектепке')" 2>/dev/null || true)
            [ "$out" = "$want" ] && break
          done
          docker logs kaa | tail -20
          echo "got: $out"
          [ "$out" = "$want" ]
